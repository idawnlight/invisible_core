name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  INVISIBLE_CORE_AUTOFIX: "off"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build hatchling
      - name: Arm checkout hooks
        run: python scripts/install_hooks.py
      - name: Test the tagged source
        run: python -m pytest -q -rs
      - name: Build and verify the release artifacts
        run: python -m invisible_core.github_release --project-root . --tag "$RELEASE_TAG" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-release
          path: dist/*
          if-no-files-found: error

  upload:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release
          path: dist
      - name: Verify the tested artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --dir existing
            diff -u dist/SHA256SUMS existing/SHA256SUMS
            (cd existing && sha256sum --check SHA256SUMS)
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
