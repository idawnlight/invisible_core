name: user-install

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '05 6 * * *'

permissions:
  contents: read

concurrency:
  group: user-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Firefox runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6t64
      - name: Install only the test harness
        run: |
          python -m venv .install-harness
          .install-harness/bin/python -m pip install --upgrade pip pytest packaging
          .install-harness/bin/python -I - <<'PY'
          import importlib.metadata
          for name in ('invisible-core', 'invisible-playwright'):
              try:
                  importlib.metadata.distribution(name)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f'{name} must not be installed in the harness')
          PY
      - name: Install Git tag and download the default engine
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          .install-harness/bin/python -I -m pytest tests/test_github_install_e2e.py \
            -m e2e -o addopts= -o pythonpath= --noconftest \
            -p no:invisible_core.testing.world -v -rs --junitxml=user-install.xml
      - name: Verify all installation checks ran
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          expected = {
              'test_git_tag_installs_a_noneditable_package',
              'test_default_release_downloads_into_an_empty_cache',
              'test_second_lookup_reuses_the_cache_without_network',
              'test_downloaded_firefox_reports_the_sealed_version',
          }
          cases = list(ET.parse('user-install.xml').getroot().iter('testcase'))
          passed = {case.attrib['name'] for case in cases
                    if not any(case.find(name) is not None
                               for name in ('skipped', 'failure', 'error'))}
          if passed != expected:
              raise SystemExit(f'installation checks differ: expected {expected}, passed {passed}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-install-linux-x86_64
          path: user-install.xml
